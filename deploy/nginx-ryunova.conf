# Single entry from ALB: port 8011. Routes /api/* and /health to FastAPI; everything else to Django.
# Upstreams match docker-compose service names.

upstream ryunova_api {
    server api:8010;
    keepalive 32;
}

upstream ryunova_web {
    server web:8011;
    keepalive 16;
}

server {
    listen 8011;
    server_name _;

    client_max_body_size 100m;

    # FastAPI: API + mounted media + OpenAPI
    location /api/ {
        proxy_pass http://ryunova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://ryunova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://ryunova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://ryunova_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Django (HTML, /static/, etc.)
    location / {
        proxy_pass http://ryunova_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
