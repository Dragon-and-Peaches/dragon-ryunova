<svg width="100%" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
<defs>
  
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
</defs>

<!-- Black canvas -->
<rect x="0" y="0" width="680" height="280" rx="12" fill="#000000" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Main wordmark: all-caps, italic, split weight treatment -->
<text x="340" y="148" font-family="'Exo 2', 'Arial Black', sans-serif" font-size="96" font-weight="800" font-style="italic" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" letter-spacing="6" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Exo 2&quot;, &quot;Arial Black&quot;, sans-serif;font-size:96px;font-weight:800;font-style:italic;text-anchor:middle;dominant-baseline:central">RYUNOVA</text>

<!-- Gradient underline accent bar  full width of text -->
<rect x="104" y="198" width="472" height="3" rx="1.5" fill="url(#rg)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Tagline below the bar -->
<text x="340" y="228" font-family="'Exo 2', 'Arial', sans-serif" font-size="11" font-weight="800" font-style="normal" text-anchor="middle" fill="#6366F1" letter-spacing="7" style="fill:rgb(99, 102, 241);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Exo 2&quot;, Arial, sans-serif;font-size:11px;font-weight:800;text-anchor:middle;dominant-baseline:auto">ENGINEERED PLATFORM</text>

</svg>
