<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
</defs>

<!-- Transparent background  no rect fill -->

<!-- Main wordmark -->
<text x="340" y="100" font-family="'Exo 2', 'Arial Black', sans-serif" font-size="110" font-weight="800" font-style="italic" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" letter-spacing="6" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Exo 2&quot;, &quot;Arial Black&quot;, sans-serif;font-size:110px;font-weight:800;font-style:italic;text-anchor:middle;dominant-baseline:central">RYUNOVA</text>

<!-- Gradient underline -->
<rect x="40" y="152" width="600" height="3" rx="1.5" fill="url(#rg)" style="stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

<!-- Tagline  letter-spacing tuned so text spans x=40 to x=640 -->
<text x="340" y="178" font-family="'Exo 2', 'Arial', sans-serif" font-size="16" font-weight="800" font-style="normal" text-anchor="middle" dominant-baseline="central" fill="#6366F1" letter-spacing="23.5" textLength="600" lengthAdjust="spacing" style="fill:rgb(99, 102, 241);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Exo 2&quot;, Arial, sans-serif;font-size:16px;font-weight:800;text-anchor:middle;dominant-baseline:central">ENGINEERED PLATFORM</text>

</svg>
